[mypy]

# Matches any tests/ directory (apps/octopus-app/tests, apps/hive-app/tests,
# libs/common/tests), not just a single top-level one -- same pattern as
# .pre-commit-config.yaml's mypy/bandit hook excludes.
exclude=(^|/)tests/
# So an IDE-invoked mypy (which walks/discovers files via this config rather
# than the explicit paths CI/pre-commit pass on the command line) resolves
# octopus_app/hive_app/common the same way -- mirrors pyproject.toml's
# [tool.pytest.ini_options] pythonpath.
mypy_path = apps/octopus-app:apps/hive-app
disallow_untyped_defs = True
disallow_subclassing_any = True
disallow_untyped_calls = False
check_untyped_defs = True
disallow_untyped_decorators = False
ignore_missing_imports = True
implicit_reexport = False
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
plugins = sqlmypy, pydantic.mypy
