# NOTE: this file is a reference copy, not the deployment source of truth.
# The actual deployed stack lives at /home/pi/git/pi-desktop/docker/docker-compose.yml
# on pi-desktop (combined with other services, project name "docker"). Keep this file
# in sync with that one manually until #495 (compose/CI/deployment structure) lands
# a better mechanism.
services:
  hive-app:
    container_name: hive-app
    image: mholubinka1/hive-app:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # The image runs as non-root UID 999 (deployments/hive-app/Dockerfile), and this
    # directory now needs to be *writable* by that UID, not just readable --
    # hive_auth_state.json (see ADR-0019) is created/rewritten here on every
    # login/refresh, not just read like hive-config.yml. Provision the host
    # path (chown to UID 999, or an equivalent ACL) before first deploy, or
    # the first successful login can never be persisted.
    volumes:
      - /mnt/media/pi-media/containers/hive-app/config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 192.168.0.50
      - 1.1.1.1
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
